<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión: Dientes Limpios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #1F63D8;
    --azul-osc: #0E2F86;
    --verde: #2E9E4A;
    --amarillo: #FFD23F;
    --texto: #152B57;
    --vidrio: rgba(255, 255, 255, .86);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061233;
    font-family: 'Baloo 2', 'Trebuchet MS', 'DejaVu Sans', sans-serif; color: var(--texto); }
  #marco { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* Escenario fijo 4:3 (1200×900) que se escala para entrar en cualquier pantalla. */
  #escenario { position: relative; width: 1200px; height: 900px; flex: none; overflow: hidden;
    transform-origin: center center; border-radius: 28px; background: #3F8FE0; }
  .pantalla { position: absolute; inset: 0; display: none; }
  .pantalla.activa { display: block; }
  .pantalla > svg { position: absolute; inset: 0; display: block; }
  button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* ---------- Inicio y final ---------- */
  .noche { background: radial-gradient(ellipse at 72% 28%, #1F4FB5 0%, #10307A 45%, #081B4F 100%); }
  .titulo { position: absolute; left: 600px; top: 70px; width: 580px; text-align: center; line-height: .84; }
  .titulo span { display: block; font-weight: 800; paint-order: stroke fill; }
  .titulo .t1 { font-size: 76px; color: #fff; -webkit-text-stroke: 9px #1753C9; }
  .titulo .t2 { font-size: 118px; color: #FFD23F; -webkit-text-stroke: 12px #1753C9; text-shadow: 0 9px 0 #0B3A99; }
  .titulo .t3 { font-size: 118px; color: #9BE3FF; -webkit-text-stroke: 12px #1753C9; text-shadow: 0 9px 0 #0B3A99; }
  .lema { position: absolute; left: 600px; top: 520px; width: 580px; text-align: center;
    color: #fff; font-size: 42px; font-weight: 700; line-height: 1.15; }
  .boton-amarillo { position: absolute; background: linear-gradient(#FFE36A, #FFC21A);
    color: #1753C9; font-size: 50px; font-weight: 800; border-radius: 999px;
    box-shadow: 0 8px 0 #D99A00, 0 14px 30px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; gap: 20px; }
  .boton-amarillo:active { transform: translateY(6px); box-shadow: 0 2px 0 #D99A00; }
  #btn-comenzar { left: 680px; top: 680px; width: 420px; height: 108px; }
  .fin-titulo { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 120px;
    font-weight: 800; color: #FFD23F; -webkit-text-stroke: 12px #1753C9; paint-order: stroke fill; }
  .fin-texto { position: absolute; left: 0; right: 0; top: 480px; text-align: center; color: #fff;
    font-size: 50px; font-weight: 700; line-height: 1.15; }
  .racha { position: absolute; left: 330px; top: 630px; width: 540px; height: 88px; border-radius: 999px;
    background: #1B3C8C; border: 5px solid #6FA8FF; color: #fff; font-size: 40px; font-weight: 700; white-space: nowrap;
    display: flex; align-items: center; padding: 0 16px 0 28px; gap: 16px; }
  .racha .num { margin-left: auto; width: 62px; height: 62px; border-radius: 50%; background: #FFD23F;
    color: #1753C9; font-size: 42px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  #btn-volver { left: 350px; top: 760px; width: 500px; height: 96px; font-size: 44px; }

  /* ---------- Pasos (interfaz de vidrio esmerilado, como la referencia) ---------- */
  .ui-reloj { position: absolute; left: 26px; top: 22px; width: 150px; height: 150px; }
  .ui-reloj .cifra { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: #fff; font-weight: 800; font-size: 40px; line-height: .9; padding-top: 4px; }
  .ui-paso { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); height: 92px;
    background: var(--vidrio); border-radius: 30px; box-shadow: 0 8px 24px rgba(10,40,110,.25);
    display: flex; align-items: center; gap: 16px; padding: 0 38px 0 14px; white-space: nowrap;
    backdrop-filter: blur(6px); }
  .ui-paso .icono { width: 72px; height: 72px; flex: none; }
  .ui-paso .nombre { font-size: 40px; font-weight: 700; color: var(--texto); }
  .ui-paso .contador { position: absolute; left: 50%; top: -18px; transform: translateX(-50%);
    background: rgba(40, 70, 130, .75); color: #fff; font-size: 24px; font-weight: 800; padding: 0 16px;
    border-radius: 999px; line-height: 34px; }
  .ui-lista { position: absolute; right: 24px; top: 36px; width: 84px; padding: 14px 0; border-radius: 42px;
    background: rgba(255,255,255,.55); display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 8px 24px rgba(10,40,110,.2); backdrop-filter: blur(6px); }
  .ui-lista span { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: #6D86AD; background: #C9D8EC; transition: transform .3s;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
  .ui-lista span.hecho { color: #fff; background: #7FCB93; }
  .ui-lista span.actual { color: #fff; background: var(--verde); transform: scale(1.15);
    box-shadow: 0 0 0 4px #fff, 0 4px 12px rgba(0,0,0,.25); }
  .flecha { position: absolute; bottom: 34px; width: 108px; height: 108px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3E8BFF, #1646B8 70%); border: 6px solid rgba(255,255,255,.9);
    box-shadow: 0 8px 20px rgba(10,40,110,.4); display: flex; align-items: center; justify-content: center; }
  .flecha:active { transform: scale(.94); }
  .flecha:disabled { opacity: .4; cursor: default; }
  #btn-anterior { left: 30px; }
  #btn-siguiente { right: 30px; }
  .ui-consejo { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: 880px; min-height: 116px;
    background: var(--vidrio); border-radius: 36px; box-shadow: 0 10px 28px rgba(10,40,110,.3);
    display: flex; align-items: center; gap: 20px; padding: 12px 28px 12px 16px; backdrop-filter: blur(6px); }
  .ui-consejo button { width: 84px; height: 84px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #3E8BFF, #1646B8 75%);
    display: flex; align-items: center; justify-content: center; }
  .ui-consejo .l1 { font-size: 31px; font-weight: 800; line-height: 1.1; color: var(--texto); }
  .ui-consejo .l2 { font-size: 27px; font-weight: 600; line-height: 1.15; color: #2F4C80; }
  .pista { position: absolute; left: 780px; top: 640px; width: 200px; text-align: center; background: #FFD23F; color: #1753C9;
    font-size: 36px; font-weight: 800; border-radius: 999px; padding: 4px 0; box-shadow: 0 6px 0 #D99A00, 0 10px 20px rgba(0,0,0,.25);
    pointer-events: none; animation: latido 1s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.08); } }
  /* Clip de video generado con IA (PixVerse/OpenArt) que reemplaza al dibujo cuando existe. */
  .video-escena { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
  /* Con video, se ve la interfaz que trae el video: la del juego se oculta,
     pero las flechas siguen funcionando (invisibles) sobre las del video. */
  .con-video .ui-reloj, .con-video .ui-paso, .con-video .ui-lista, .con-video .ui-consejo,
  .con-video .pista { visibility: hidden; }
  .con-video .flecha { opacity: 0; width: 180px; height: 180px; bottom: 16px; }
  .con-video #btn-anterior { left: 16px; }
  .con-video #btn-siguiente { right: 16px; }
  #p-mision.con-video { cursor: pointer; }
  #bien { position: absolute; left: 50%; top: 230px; transform: translateX(-50%) scale(0); font-size: 110px;
    font-weight: 800; color: #FFD23F; -webkit-text-stroke: 12px #1753C9; paint-order: stroke fill;
    transition: transform .35s cubic-bezier(.3,1.6,.5,1); pointer-events: none; white-space: nowrap; }
  #bien.ver { transform: translateX(-50%) scale(1); }
</style>
</head>
<body>
<div id="marco">
  <div id="escenario">

    <!-- ================= INICIO ================= -->
    <section id="p-inicio" class="pantalla noche activa">
      <svg id="svg-inicio" viewBox="0 0 1200 900" width="1200" height="900"></svg>
      <div class="titulo"><span class="t1">Misión:</span><span class="t2">Dientes</span><span class="t3">Limpios</span></div>
      <div class="lema">¡Vamos a cepillarnos<br>paso a paso!</div>
      <button id="btn-comenzar" class="boton-amarillo">
        <svg width="60" height="60" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#1753C9"/><path d="M25 18L47 32L25 46Z" fill="#fff"/></svg>
        Comenzar
      </button>
    </section>

    <!-- ============ MISIÓN: SUPERDIENTE PIDE EL CEPILLO ============ -->
    <section id="p-mision" class="pantalla">
      <video class="video-escena" id="video-mision" muted loop playsinline preload="auto"></video>
      <svg id="svg-mision" viewBox="0 0 1200 900" width="1200" height="900"></svg>
      <div class="ui-paso">
        <svg class="icono" viewBox="0 0 76 76"><circle cx="38" cy="38" r="36" fill="#FFF3C4"/><path d="M38 12l7.6 15.4 17 2.5-12.3 12 2.9 16.9L38 50.8l-15.2 8 2.9-16.9-12.3-12 17-2.5z" fill="#FFC21A" stroke="#E0A100" stroke-width="3" stroke-linejoin="round"/></svg>
        <span class="nombre">¡Tu misión!</span>
      </div>
      <div class="pista" id="pista-cepillo">¡Tocalo!</div>
      <div class="ui-consejo">
        <button id="btn-voz-mision" aria-label="Escuchar a Superdiente">
          <svg width="48" height="48" viewBox="0 0 54 54"><path d="M8 20h9l12-10v34L17 34H8z" fill="#fff"/><path d="M36 18q6 9 0 18M42 12q11 15 0 30" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div><div class="l1" id="mision-1">¡Hola! Soy Superdiente.</div><div class="l2" id="mision-2">¡Agarrá tu cepillo de dientes para empezar!</div></div>
      </div>
      <button class="flecha" id="btn-mision-seguir" aria-label="Agarrar el cepillo" style="right:30px">
        <svg width="50" height="50" viewBox="0 0 54 54"><path d="M21 10L38 27L21 44" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </section>

    <!-- ================= PASOS ================= -->
    <section id="p-paso" class="pantalla">
      <video class="video-escena" id="video-paso" muted loop playsinline preload="auto"></video>
      <svg id="svg-paso" viewBox="0 0 1200 900" width="1200" height="900"></svg>

      <div class="ui-reloj">
        <svg viewBox="0 0 150 150" width="150" height="150">
          <defs><radialGradient id="gReloj" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#2F72E8"/><stop offset="1" stop-color="#0E3596"/></radialGradient></defs>
          <circle cx="75" cy="75" r="72" fill="rgba(255,255,255,.35)"/>
          <circle cx="75" cy="75" r="62" fill="url(#gReloj)"/>
          <circle id="reloj-anillo" cx="75" cy="75" r="67" fill="none" stroke="#FFFFFF" stroke-width="8"
                  stroke-linecap="round" transform="rotate(-90 75 75)" stroke-dasharray="421 421"/>
        </svg>
        <div class="cifra">
          <svg width="30" height="30" viewBox="0 0 34 34"><circle cx="17" cy="19" r="12" fill="none" stroke="#fff" stroke-width="4"/><path d="M17 12v7l5 3M12 3h10" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/></svg>
          <span id="reloj-texto">0:20</span>
        </div>
      </div>

      <div class="ui-paso">
        <span class="contador" id="paso-contador">1/8</span>
        <svg class="icono" id="paso-icono" viewBox="0 0 76 76"></svg>
        <span class="nombre" id="paso-nombre">Dientes de arriba</span>
      </div>

      <div class="ui-lista" id="lista"></div>

      <div id="bien">¡Muy bien!</div>

      <button class="flecha" id="btn-anterior" aria-label="Paso anterior">
        <svg width="50" height="50" viewBox="0 0 54 54"><path d="M33 10L16 27L33 44" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <div class="ui-consejo">
        <button id="btn-voz" aria-label="Escuchar la consigna">
          <svg width="48" height="48" viewBox="0 0 54 54"><path d="M8 20h9l12-10v34L17 34H8z" fill="#fff"/><path d="M36 18q6 9 0 18M42 12q11 15 0 30" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div><div class="l1" id="consejo-1"></div><div class="l2" id="consejo-2"></div></div>
      </div>
      <button class="flecha" id="btn-siguiente" aria-label="Paso siguiente">
        <svg width="50" height="50" viewBox="0 0 54 54"><path d="M21 10L38 27L21 44" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </section>

    <!-- ================= FINAL ================= -->
    <section id="p-final" class="pantalla noche">
      <svg id="svg-final" viewBox="0 0 1200 900" width="1200" height="900"></svg>
      <div class="fin-titulo">¡Lo hiciste!</div>
      <div class="fin-texto">¡Dientes limpios<br>y una gran sonrisa!</div>
      <div class="racha">
        <svg width="48" height="48" viewBox="0 0 50 50"><path d="M25 4C29 14 40 18 40 31A15 15 0 0 1 10 31C10 23 15 19 18 14C19 20 22 22 24 22C22 15 23 9 25 4Z" fill="#FF7A2F"/><path d="M25 24C28 29 32 31 32 36A7 7 0 0 1 18 36C18 31 22 29 25 24Z" fill="#FFD23F"/></svg>
        Racha de días <span class="num" id="racha-num">1</span>
      </div>
      <button id="btn-volver" class="boton-amarillo">
        <svg width="50" height="50" viewBox="0 0 54 54"><path d="M8 26L27 9L46 26M14 22V45H24V33H30V45H40V22" stroke="#1753C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Volver al inicio
      </button>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     DATOS DE LOS 8 PASOS  (coordenadas en el sistema del niño, ver nino())
     cabezal: posición del cabezal del cepillo en la boca
     angulo:  inclinación del cepillo (el mango baja hacia la izquierda)
     abajo:   cerdas hacia abajo (dientes inferiores)
     mov:     'lado' | 'vertical' | 'eje' (adelante-atrás) | 'circulo'
     boca:    'abierta' | 'dientes' (mordida, cara de adelante) | 'enjuague'
     ===================================================================== */
  var PASOS = [
    { id: 'dientes-adelante', nombre: 'Dientes de adelante', icono: 'adelante', boca: 'dientes', cabezal: [770, 590], angulo: -8, abajo: false, mov: 'vertical', sarro: 'adelante',
      l1: '¡Primero, los dientes de adelante!', l2: 'Mové el cepillo de arriba hacia abajo.' },
    { id: 'muelas-arriba', nombre: 'Muelas de arriba', icono: 'arriba', boca: 'abierta', cabezal: [856, 566], angulo: -6, abajo: false, mov: 'circulo', sarro: 'muelasArribaDer',
      l1: '¡Ahora las muelas de arriba!', l2: 'Hacé circulitos en las muelas de este lado.' },
    { id: 'muelas-arriba-otro-lado', nombre: 'Muelas de arriba (otro lado)', icono: 'arriba', boca: 'abierta', cabezal: [742, 566], angulo: -12, abajo: false, mov: 'circulo', sarro: 'muelasArribaIzq',
      l1: '¡Las muelas de arriba del otro lado!', l2: 'Pasá el cepillo al otro lado y hacé circulitos.' },
    { id: 'muelas-abajo', nombre: 'Muelas de abajo', icono: 'abajo', boca: 'abierta', cabezal: [856, 604], angulo: -8, abajo: true, mov: 'circulo', sarro: 'muelasAbajoDer',
      l1: '¡Ahora las muelas de abajo!', l2: 'Hacé circulitos en las muelas de este lado.' },
    { id: 'muelas-abajo-otro-lado', nombre: 'Muelas de abajo (otro lado)', icono: 'abajo', boca: 'abierta', cabezal: [742, 604], angulo: -14, abajo: true, mov: 'circulo', sarro: 'muelasAbajoIzq',
      l1: '¡Las muelas de abajo del otro lado!', l2: 'Pasá el cepillo al otro lado y hacé circulitos.' },
    { id: 'bolsillos', nombre: 'Bolsillos', icono: 'adelante', boca: 'dientes', cabezal: [872, 590], angulo: -4, abajo: false, mov: 'circulo', sarro: 'bolsilloDer',
      l1: '¡Los bolsillos! Los dientes del costado.', l2: 'Cepillá pegado al cachete, con circulitos.' },
    { id: 'bolsillos-otro-lado', nombre: 'Bolsillos (otro lado)', icono: 'adelante', boca: 'dientes', cabezal: [724, 590], angulo: -10, abajo: false, mov: 'circulo', sarro: 'bolsilloIzq',
      l1: '¡Los bolsillos del otro lado!', l2: 'Ahora pegado al otro cachete, con circulitos.' },
    { id: 'dientes-abajo', nombre: 'Dientes de abajo', icono: 'abajo', boca: 'abierta', cabezal: [770, 604], angulo: -12, abajo: true, mov: 'lado', sarro: 'abajo',
      l1: '¡Y por último, los dientes de abajo!', l2: 'Mové el cepillo de un lado al otro.' }
  ];
  var SEGUNDOS_POR_PASO = 20;
  var HZ_CEPILLADO = 2;

  // Paleta cálida tomada del video de referencia.
  var C = {
    piel: '#F3AE7C', pielClara: '#F9C597', pielSombra: '#DE8A57', pielLinea: '#C06A3E',
    pelo: '#3B1B0C', peloLuz: '#5E2D14', peloOsc: '#230F06',
    remera: '#1D3E9E', remeraOsc: '#132C73', remeraLuz: '#2B55BF',
    cepillo: '#1E5FE0', cepilloLuz: '#6FB6FF', cepilloOsc: '#1342A8',
    boca: '#5A1420', lengua: '#E0606E', labio: '#B8503F', ojo: '#2A1408'
  };

  /* =====================================================================
     DIBUJO (SVG como texto)
     ===================================================================== */

      '<defs>' +
        '<filter id="desenfoque' + u + '" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="7"/></filter>' +

  // Puño que agarra un mango horizontal (coordenadas locales del cepillo).
  function manoAtras(x, y) {
    return '<ellipse cx="' + (x + 4) + '" cy="' + (y + 8) + '" rx="66" ry="60" fill="' + C.pielSombra + '"/>';
  }
  function manoDedos(x, y, u) {
    var s = '';
    // cuatro dedos curvados sobre el mango, vistos de frente

  // Fila de dientes redondeados; `arriba` redondea el borde inferior (dientes superiores).
  function dientesFila(x0, x1, yTop, alto, n, arriba) {

    for (var i = 0; i < n; i++) {

  /* Superdiente: muela blanca con contorno azul y borde blanco tipo sticker, capa roja

        '<circle cx="180" cy="-212" r="6" fill="#FFF1B8"/></g>' +
        brazo('M96 0Q150-12 160-70') + puno(160, -80);

  /* Animación de Superdiente:
     - entrada volando en curva desde arriba a la izquierda, con rebote al llegar;
     - vuelo en el lugar: sube y baja, se balancea y se estira/aplasta un poco;
     - capa flameando, saludo con el brazo, varita que chisporrotea, chispitas;
     - boca que se mueve mientras habla, parpadeo;
     - festejo (data-feliz): salto con giro completo. */
  function suavizarRebote(k) { var c = 1.70158; k -= 1; return k * k * ((c + 1) * k + c) + 1; }

  function posarDiente(g, t, fase) {
    if (!g) return;
    var x = +g.getAttribute('data-x'), y = +g.getAttribute('data-y'), s = +g.getAttribute('data-s');
    var t0 = +(g.getAttribute('data-t0') || -100);
    var tl = t - t0;           // tiempo desde que apareció la pantalla
    var tt = t + (fase || 0);  // reloj propio para que no todos se muevan igual

    // Entrada: vuela desde arriba-izquierda y frena con un rebote.
    var ENTRADA = 1.1, dx = 0, dy = 0, giro = 0, esc = 1;
    if (tl < ENTRADA) {
      var k = Math.max(0, tl / ENTRADA), e = suavizarRebote(k);
      dx = (1 - e) * -520; dy = (1 - e) * -380 + Math.sin(k * Math.PI) * -60;
      giro = (1 - e) * -35; esc = 0.35 + 0.65 * e;
    }
    // Vuelo en el lugar.
    var w = 2 * Math.PI * tt;
    dy += 22 * Math.sin(w / 1.6);
    giro += 5 * Math.sin(w / 2.2);
    var estira = 0.045 * Math.sin(w / 0.8);
    // Festejo: salto con giro.
    var fiesta = g.getAttribute('data-fiesta');
    if (fiesta !== null) {
      var kf = Math.min(1, (t - +fiesta) / 0.9);
      dy -= 120 * Math.sin(kf * Math.PI);
      giro += 360 * (kf * kf * (3 - 2 * kf));
    }
    g.setAttribute('transform', 'translate(' + (x + dx * s).toFixed(1) + ' ' + (y + dy * s).toFixed(1) + ') rotate(' + giro.toFixed(2) + ') scale(' +
      (s * esc * (1 - estira)).toFixed(4) + ' ' + (s * esc * (1 + estira)).toFixed(4) + ')');

    g.querySelector('.sd-aura').setAttribute('transform', 'scale(' + (0.9 + 0.12 * Math.sin(w / 1.2)).toFixed(3) + ')');
    g.querySelector('.sd-aura').setAttribute('opacity', (0.7 + 0.3 * Math.sin(w / 1.2)).toFixed(2));
    g.querySelector('.sd-haz').setAttribute('transform', 'translate(0 130) scale(' + (1 + 0.1 * Math.sin(w * 5)).toFixed(3) + ' ' + (0.8 + 0.25 * Math.abs(Math.sin(w * 2.5))).toFixed(3) + ') translate(0 -130)');
    g.querySelector('.sd-capa').setAttribute('transform', 'translate(0 -40) skewX(' + (9 * Math.sin(w / 0.7)).toFixed(2) + ') scale(' + (1 + 0.06 * Math.sin(w / 0.35)).toFixed(3) + ' 1) translate(0 40)');
    g.querySelector('.sd-brazo-izq').setAttribute('transform', 'rotate(' + (-8 + 28 * Math.sin(w / 0.7)).toFixed(2) + ' -96 0)');
    g.querySelector('.sd-lineas').setAttribute('opacity', (0.3 + 0.6 * Math.abs(Math.sin(w / 1.6))).toFixed(2));
    var varita = g.querySelector('.sd-varita');
    if (varita) varita.setAttribute('transform', 'rotate(' + (8 * Math.sin(w / 0.9)).toFixed(2) + ' 160 -80)');
    var llama = g.querySelector('.sd-llama');
    if (llama) llama.setAttribute('r', (24 + 10 * Math.abs(Math.sin(w * 2))).toFixed(1));
    Array.prototype.forEach.call(g.querySelectorAll('.sd-chispas path'), function (c) {
      var i = +c.getAttribute('data-i'), v = Math.sin(w / 0.9 + i * 1.3);
      c.setAttribute('opacity', Math.max(0, v).toFixed(2));
    });
    // Boca: se abre y cierra mientras Superdiente habla.
    var boca = g.querySelector('.sd-bocag');
    var abre = tt < hablandoHasta ? 0.55 + 0.6 * Math.abs(Math.sin(w * 3.2)) : 1;
    boca.setAttribute('transform', 'translate(0 -10) scale(1 ' + abre.toFixed(3) + ') translate(0 10)');
    // Parpadeo (o ojitos felices al festejar).
    var cerrado = (tt % 3.1) < 0.18 || g.getAttribute('data-feliz') === '1';
    g.querySelector('.sd-ojos').style.display = cerrado ? 'none' : '';
    g.querySelector('.sd-ojos-cerrados').style.display = cerrado ? '' : 'none';
  }

  var CARPETA_VIDEOS = 'recursos/videos/';
  function ponerVideo(video, nombre, svg, selectorOcultar) {

    video.onloadeddata = function () {

    var formatos = ['.mp4', '.webm']; // MP4 para Chrome/Safari; WebM para navegadores sin H.264

  // Flecha curva con dos puntas (como las del video, debajo del mentón).
  function trazoFlecha(d) {
    return '<path d="' + d + '" stroke="#FFFFFF" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
           '<path d="' + d + '" stroke="#4FA8F0" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  function punta(x, y, dx, dy) {
    var L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, h = 24;
    return 'M' + (x - ux * h - uy * h * .75) + ' ' + (y - uy * h + ux * h * .75) + 'L' + x + ' ' + y +
           'L' + (x - ux * h + uy * h * .75) + ' ' + (y - uy * h - ux * h * .75);
  }
  function flechaCurva(x1, y1, x2, y2, curva) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    var cx = mx - dy / L * curva, cy = my + dx / L * curva;

    return trazoFlecha(d);

  function flechaCircular(cx, cy, r) {
    var d = 'M' + (cx + r) + ' ' + cy + 'A' + r + ' ' + r + ' 0 1 1 ' + cx + ' ' + (cy - r) +
            'M' + (cx - 22) + ' ' + (cy - r - 20) + 'L' + cx + ' ' + (cy - r) + 'L' + (cx - 22) + ' ' + (cy - r + 20);
    return trazoFlecha(d);
  }

  function dibujarGuias(svg, p) {
    var s = '';
    if (p.mov === 'lado') {
      var y = p.abajo ? 716 : 700;
      s = flechaCurva(672, y - 14, 780, y + 8, 22) + flechaCurva(820, y + 8, 928, y - 14, 22);
    } else if (p.mov === 'vertical') {
      s = flechaCurva(960, 530, 960, 660, -18) + flechaCurva(640, 530, 640, 660, 18);
    } else if (p.mov === 'eje') {
      var a = p.angulo * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      var cx = p.cabezal[0] + 20, cy = p.abajo ? 722 : 506;
      s = flechaCurva(cx - 80 * ca, cy - 80 * sa, cx + 80 * ca, cy + 80 * sa, p.abajo ? 16 : -16);
    } else if (p.mov === 'circulo') {
      s = flechaCircular(p.cabezal[0] + (p.cabezal[0] < 800 ? -46 : 66), p.cabezal[1] + (p.abajo ? 30 : -16), 58);
    }
    svg.querySelector('#guias').innerHTML = s;
  }

  // Coloca el cepillo/vaso y recalcula el brazo para que siempre llegue a la mano.
  function colocarProp(svg, prop, x, y, ang, muneca) {
    prop.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ') rotate(' + ang.toFixed(2) + ')');
    var a = ang * Math.PI / 180, mx = muneca[0], my = muneca[1];
    var wx = x + mx * Math.cos(a) - my * Math.sin(a);
    var wy = y + mx * Math.sin(a) + my * Math.cos(a);
    var hx = 390, hy = 880; // salida del brazo desde la manga
    var cx = hx - 40, cy = (hy + wy) / 2 + 70;
    var d = 'M' + hx + ' ' + hy + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + wx.toFixed(1) + ' ' + wy.toFixed(1);
    svg.querySelector('#brazo').setAttribute('d', d);
    svg.querySelector('#brazo-luz').setAttribute('d', 'M' + (hx + 14) + ' ' + (hy - 10) + 'Q' + (cx + 14).toFixed(1) + ' ' + (cy - 10).toFixed(1) + ' ' + (wx + 10).toFixed(1) + ' ' + (wy - 20).toFixed(1));
  }

  /* ---------- Bucle de animación ---------- */
  function animar(t) {
    if (estado.pantalla === 'paso') posarPaso($('svg-paso'), PASOS[estado.paso], t, estado.tiempo);
    if (estado.pantalla === 'inicio') posarInicio(t);
    if (estado.pantalla === 'mision') posarMision(t);
    if (estado.pantalla === 'final') { posarTitilar($('svg-final'), t); posarDiente($('svg-final').querySelector('#sd-final'), t, 0.7); }
  }

  // Ojos cerrados unos 0,15 s cada `periodo` segundos, como en el video.
  function parpadea(t, periodo) { return (t % periodo) < 0.15; }
  function aplicarParpadeo(svg, cerrado) {
    svg.querySelector('#ojos').style.display = cerrado ? 'none' : '';
    svg.querySelector('#ojos-cerrados').style.display = cerrado ? '' : 'none';
  }

  function posarPaso(svg, p, t, tiempoPaso) {
    var w = 2 * Math.PI * HZ_CEPILLADO * t;
    // la cabeza acompaña el cepillado con un leve vaivén
    svg.querySelector('#cabeza').setAttribute('transform', 'rotate(' + (1.2 * Math.sin(w * 0.5)).toFixed(2) + ' 800 720)');

    if (p.mov === 'ninguno') {
      var b = 8 * Math.sin(2 * Math.PI * t / 1.4);
      colocarProp(svg, svg.querySelector('#vaso'), 610, 700 + b, -6, [0, 80]);
      svg.querySelector('#gotas').setAttribute('opacity', (0.5 + 0.5 * Math.sin(2 * Math.PI * t)).toFixed(2));
      svg.querySelector('#boca-enjuague').setAttribute('transform', 'translate(0 572) scale(1 ' + (1 + 0.03 * Math.sin(w)).toFixed(3) + ') translate(0 -572)');
    } else {
      aplicarParpadeo(svg, parpadea(t, 3.4));
      var dx = 0, dy = 0, a = p.angulo * Math.PI / 180;
      if (p.mov === 'lado') { dx = 34 * Math.sin(w); dy = 3 * Math.sin(2 * w); }
      if (p.mov === 'vertical') { dy = 18 * Math.sin(w); }
      if (p.mov === 'eje') { var e = 28 * Math.sin(w); dx = e * Math.cos(a); dy = e * Math.sin(a); }
      if (p.mov === 'circulo') { dx = 15 * Math.cos(w); dy = 11 * Math.sin(w); }
      colocarProp(svg, svg.querySelector('#cepillo'), p.cabezal[0] + dx, p.cabezal[1] + dy, p.angulo + 1.5 * Math.sin(w), [-320, 30]);
      Array.prototype.forEach.call(svg.querySelectorAll('.burbuja'), function (c) {
        var i = +c.getAttribute('data-i');
        c.setAttribute('transform', 'translate(0 ' + (-4 * Math.sin(w * 1.5 + i)).toFixed(2) + ')');
        c.setAttribute('opacity', (0.7 + 0.3 * Math.sin(w + i * 1.7)).toFixed(2));
      });
    }

    svg.querySelector('#guias').setAttribute('opacity', (0.7 + 0.3 * Math.sin(2 * Math.PI * t / 0.9)).toFixed(2));
    var limpio = Math.min(1, tiempoPaso / (SEGUNDOS_POR_PASO * 0.85));
    Array.prototype.forEach.call(svg.querySelectorAll('#sarro-abierta ellipse, #sarro-dientes ellipse'), function (m, i) {
      m.setAttribute('opacity', Math.max(0, 1 - limpio * (1 + i * 0.12)).toFixed(2));
    });
  }

  function posarInicio(t) {
    var svg = $('svg-inicio');
    aplicarParpadeo(svg, parpadea(t, 3.2));
    svg.querySelector('#cabeza').setAttribute('transform', 'rotate(' + (2 * Math.sin(2 * Math.PI * t / 2.4)).toFixed(2) + ' 800 720)');
    posarTitilar(svg, t);
    posarDiente(svg.querySelector('#sd-inicio'), t, 0.3);
  }

  function posarTitilar(svg, t) {
    Array.prototype.forEach.call(svg.querySelectorAll('.titila'), function (e, i) {
      e.style.opacity = (0.35 + 0.65 * Math.abs(Math.sin(t * 1.3 + i))).toFixed(2);
    });
  }

  /* ---------- Misión: agarrar el cepillo ---------- */
  var agarre = null; // instante en que se tocó el cepillo
  function empezarMision() {
    ponerVideo($('video-mision'), 'mision', $('svg-mision'), '.fondo, #sd-mision, #premio');
    agarre = null;
    $('mision-1').textContent = '¡Hola! Soy Superdiente.';
    $('mision-2').textContent = '¡Agarrá tu cepillo de dientes para empezar!';
    $('pista-cepillo').style.display = '';
    $('svg-mision').querySelector('#sd-mision').removeAttribute('data-feliz');
    $('svg-mision').querySelector('#sd-mision').removeAttribute('data-fiesta');
    mostrar('mision');
    hablar('¡Hola! Soy Superdiente. ¡Agarrá tu cepillo de dientes para empezar!');
  }
  function agarrarCepillo() {
    if (agarre !== null) return;
    agarre = tReloj();
    $('pista-cepillo').style.display = 'none';
    $('mision-1').textContent = '¡Muy bien, ya lo tenés!';
    $('mision-2').textContent = '¡Vamos a cepillarnos paso a paso!';
    $('svg-mision').querySelector('#sd-mision').setAttribute('data-feliz', '1');
    $('svg-mision').querySelector('#sd-mision').setAttribute('data-fiesta', agarre);
    hablar('¡Muy bien, ya lo tenés! ¡Vamos a cepillarnos!');
    if (estado.auto) setTimeout(function () {
      if (estado.pantalla === 'mision') { mostrar('paso'); irAPaso(0); }
    }, 1800);
  }
  function posarMision(t) {
    var svg = $('svg-mision');
    posarDiente(svg.querySelector('#sd-mision'), t, 0);
    var premio = svg.querySelector('#premio'), anillo = svg.querySelector('.cp-anillo');
    if (agarre === null) {
      // flota y late para invitar a tocarlo
      premio.setAttribute('transform', 'translate(880 ' + (450 + 10 * Math.sin(2 * Math.PI * t / 1.5)).toFixed(2) + ') rotate(' + (4 * Math.sin(2 * Math.PI * t / 2)).toFixed(2) + ')');
      anillo.setAttribute('transform', 'scale(' + (0.85 + 0.15 * Math.sin(2 * Math.PI * t / 1)).toFixed(3) + ')');
      premio.style.opacity = 1;
    } else {
      // vuela hacia abajo, hacia la mano del niño, y se desvanece
      var k = Math.min(1, (t - agarre) / 0.9), e = k * k * (3 - 2 * k);
      premio.setAttribute('transform', 'translate(' + (880 - 260 * e).toFixed(1) + ' ' + (450 + 420 * e).toFixed(1) + ') rotate(' + (-40 * e).toFixed(1) + ') scale(' + (1 + 0.4 * e).toFixed(3) + ')');
      premio.style.opacity = (1 - e).toFixed(2);
    }
  }

  /* ---------- Reloj de 20 s por paso ---------- */
  function actualizarReloj() {
    var resta = Math.max(0, SEGUNDOS_POR_PASO - estado.tiempo);
    $('reloj-texto').textContent = '0:' + String(Math.ceil(resta)).padStart(2, '0');
    var L = 2 * Math.PI * 67;
    $('reloj-anillo').setAttribute('stroke-dasharray', (L * resta / SEGUNDOS_POR_PASO).toFixed(1) + ' ' + L.toFixed(1));
  }

  function completarPaso() {
    estado.completado = true;
    $('bien').textContent = estado.paso === PASOS.length - 1 ? '¡Excelente!' : '¡Muy bien!';
    $('bien').classList.add('ver');
    $('svg-paso').querySelector('#destellos').innerHTML =
      [[690, 470], [910, 470], [800, 440], [640, 620], [960, 620]].map(function (d) {
        var x = d[0], y = d[1];
        return '<path d="M' + x + ' ' + (y - 28) + 'C' + (x + 4) + ' ' + (y - 6) + ' ' + (x + 6) + ' ' + (y - 4) + ' ' + (x + 28) + ' ' + y +
          'C' + (x + 6) + ' ' + (y + 4) + ' ' + (x + 4) + ' ' + (y + 6) + ' ' + x + ' ' + (y + 28) +
          'C' + (x - 4) + ' ' + (y + 6) + ' ' + (x - 6) + ' ' + (y + 4) + ' ' + (x - 28) + ' ' + y +
          'C' + (x - 6) + ' ' + (y - 4) + ' ' + (x - 4) + ' ' + (y - 6) + ' ' + x + ' ' + (y - 28) + 'Z" fill="#FFFFFF" stroke="#FFD23F" stroke-width="3"/>';
      }).join('');
    if (estado.auto) setTimeout(function () {
      if (estado.pantalla === 'paso' && estado.completado) siguiente();
    }, 1600);
  }

  function siguiente() {
    if (estado.paso < PASOS.length - 1) irAPaso(estado.paso + 1);
    else terminar();
  }

  function terminar() {
    $('racha-num').textContent = actualizarRacha();
    mostrar('final');
    hablar('¡Lo hiciste! ¡Dientes limpios y una gran sonrisa!');
  }

  function actualizarRacha() {
    var hoy = new Date(), clave = function (d) { return d.toISOString().slice(0, 10); };
    var ayer = new Date(hoy.getTime() - 864e5);
    try {
      var r = JSON.parse(localStorage.getItem('dl-racha') || '{}');
      var dias = r.ultimo === clave(hoy) ? r.dias : r.ultimo === clave(ayer) ? (r.dias || 0) + 1 : 1;
      localStorage.setItem('dl-racha', JSON.stringify({ ultimo: clave(hoy), dias: dias }));
      return dias;
    } catch (e) { return 1; }
  }

  /* ---------- Voz ---------- */
  var vozActiva = true;
  var hablandoHasta = -1; // hasta cuándo mueve la boca Superdiente
  function hablar(texto) {
    hablandoHasta = tReloj() + 0.8 + texto.length * 0.065;
    if (!vozActiva || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-AR'; u.rate = 0.95; u.pitch = 1.15;
      u.onend = function () { hablandoHasta = tReloj(); };
      speechSynthesis.speak(u);
    } catch (e) { /* sin voz disponible */ }
  }

  /* ---------- Controles ---------- */
  $('btn-comenzar').onclick = empezarMision;
  $('svg-mision').querySelector('#cepillo-premio').addEventListener('click', agarrarCepillo);
  $('btn-mision-seguir').onclick = agarrarCepillo;
  // Con el video de Superdiente no hay cepillo dibujado: tocar cualquier parte lo agarra.
  $('p-mision').addEventListener('click', function () { if ($('p-mision').classList.contains('con-video')) agarrarCepillo(); });
  $('btn-voz-mision').onclick = function () { hablar($('mision-1').textContent + ' ' + $('mision-2').textContent); };
  $('btn-siguiente').onclick = siguiente;
  $('btn-anterior').onclick = function () { if (estado.paso > 0) irAPaso(estado.paso - 1); };
  $('btn-voz').onclick = function () { var p = PASOS[estado.paso]; hablar(p.l1 + ' ' + p.l2); };
  $('btn-volver').onclick = function () { mostrar('inicio'); };

  /* ---------- Escalado del escenario ---------- */
  function ajustar() {
    var e = Math.min(window.innerWidth / 1200, window.innerHeight / 900);
    $('escenario').style.transform = 'scale(' + e + ')';
  }
  window.addEventListener('resize', ajustar);
  ajustar();

  var ultimo = null, t = 0, congelado = false;
  function tReloj() { return t; }
  function bucle(ahora) {
    if (!congelado) {
      var dt = ultimo === null ? 0 : Math.min(0.1, (ahora - ultimo) / 1000);
      t += dt;
      if (estado.pantalla === 'paso' && !estado.completado) {
        estado.tiempo += dt;
        if (estado.tiempo >= SEGUNDOS_POR_PASO) { estado.tiempo = SEGUNDOS_POR_PASO; completarPaso(); }
      }
      if (estado.pantalla === 'paso') actualizarReloj();
      animar(t);
    }
    ultimo = ahora;
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);

  // Acceso para capturas y pruebas: congela el tiempo y posa una pantalla concreta.
  window.DientesLimpios = {
    PASOS: PASOS,
    posar: function (pantalla, paso, tAnim, tPaso) {
      congelado = true; vozActiva = false; estado.auto = false;
      mostrar(pantalla);
      Array.prototype.forEach.call(document.querySelectorAll('.superdiente'), function (g) { g.setAttribute('data-t0', -100); });
      if (pantalla === 'paso') { irAPaso(paso); estado.tiempo = tPaso || 0; actualizarReloj(); }
      if (pantalla === 'final') $('racha-num').textContent = '5';
      if (pantalla === 'mision') { agarre = null; $('pista-cepillo').style.display = ''; }
      animar(tAnim || 0);
    }
  };
})();
</script>
</body>
