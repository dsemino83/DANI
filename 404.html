<script>
  // GitHub Pages no tiene rutas dinámicas: /so/shared/<id> se resuelve en /so/shared/#<id>.
  (function () {
    var m = location.pathname.match(/^(.*\/so\/shared)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\/?$/);
    if (m) location.replace(m[1] + '/#' + m[2]);
  })();
</script>
