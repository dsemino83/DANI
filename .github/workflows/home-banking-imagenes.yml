# Home Banking VALO: pruebas, prueba de humo del stack completo en Docker y publicación de imágenes en Docker Hub.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  usuario u organización de Docker Hub
#   DOCKERHUB_TOKEN     access token de Docker Hub con permiso Read & Write
# Las imágenes no llevan secretos: claves, certificados y credenciales se montan al desplegar.
name: Home Banking · imágenes Docker

on:
  push:
    branches: [ALYC]
    paths: ['home-banking/**', '.devcontainer/**', '.github/workflows/home-banking-imagenes.yml']
  pull_request:
    paths: ['home-banking/**', '.devcontainer/**', '.github/workflows/home-banking-imagenes.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-banking-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: home-banking

jobs:
  pruebas:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: home-banking/backend
      - run: npm test
        working-directory: home-banking/backend

  seguridad:
    name: Seguridad (dependencias, secretos, IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks revisa todo el historial
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependencias con vulnerabilidad conocida en lo que va a producción. Bloquea en crítica.
      - name: npm audit (producción)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: home-banking/backend
      # Secretos filtrados en el código o el historial (claves, tokens, credenciales). Bloquea si encuentra.
      - name: gitleaks (secretos en el repo)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --exit-code 1
        working-directory: .
      # Trivy (imagen oficial, versión fija): vulnerabilidades del repo (fs) y malas configuraciones de contenedor/IaC.
      # BLOQUEA ante cualquier hallazgo CRITICAL (--exit-code 1, sin "|| true": si falla acá, no se publica).
      # Los HIGH quedan como informativos (se listan pero no frenan).
      - name: Trivy — bloquea CRITICAL
        run: |
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.58.1 fs --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 /scan/home-banking
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.58.1 config --severity CRITICAL --exit-code 1 /scan/home-banking
        working-directory: .
      - name: Trivy — HIGH (informativo)
        run: |
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.58.1 fs --no-progress --severity HIGH --ignore-unfixed --exit-code 0 /scan/home-banking || true
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.58.1 config --severity HIGH --exit-code 0 /scan/home-banking || true
        working-directory: .

  autorizacion:
    name: Autorización de punta a punta (BOLA y roles)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Hb-Prueba-Sa-1_ci   # solo la instancia efímera del CI
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Hb-Prueba-Sa-1_ci -Q 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 20 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: home-banking/backend
      # Prepara las bases, levanta el mock (SSO + banco) y el servidor real, y corre las pruebas de
      # BOLA (acceso a cuentas de otra empresa) y de separación de funciones por rol. Bloquea si fallan.
      - name: Prueba de autorización
        run: sh test/e2e/correr.sh
        working-directory: home-banking/backend
        env:
          MSSQL_HOST: localhost
          MSSQL_PORT: '1433'
          MSSQL_SA_PASSWORD: Hb-Prueba-Sa-1_ci

  humo:
    name: Prueba de humo (stack completo en Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secretos y certificado de prueba
        run: sh scripts/generar-secretos.sh
      - name: Configuración de prueba (Keycloak local, banco en homologación, solo consultas)
        run: |
          cat > .env <<'EOF'
          BDV_AMBIENTE=homo
          BDV_SOLO_CONSULTAS=true
          HB_URL_PUBLICA=https://localhost
          OIDC_ISSUER=https://localhost/auth/realms/staff
          OIDC_INTERNAL_URL=http://keycloak:8080/auth/realms/staff
          OIDC_ORIGIN=https://localhost
          OIDC_CLIENT_ID=home-banking-web
          OIDC_AUDIENCE=home-banking-api
          OIDC_ROLES_CLIENT=home-banking-api
          KEYCLOAK_ADMIN_CLIENT_ID=home-banking-admin
          HTTPS_PORT=443
          EOF
      - name: Levantar
        run: docker compose --profile sso-local --profile correo-prueba up -d --build --wait --wait-timeout 300
      - name: Verificar
        run: |
          set -e
          curl -fsSk https://localhost/ | grep -q 'js/app.js'                       && echo 'frontend OK'
          curl -fsSk https://localhost/config.json | grep -q '"oidcIssuer"'        && echo 'config.json OK'
          curl -fsSk https://localhost/api/health                                    && echo ' health OK'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/me)" = 401 && echo '/api/me sin token → 401 OK'
          curl -fsSk -I https://localhost/ | grep -qi 'content-security-policy'      && echo 'CSP OK'
          curl -fsSk -I https://localhost/js/app.js | grep -qi 'cache-control: no-cache' && curl -fsSk -I https://localhost/js/app.js | grep -qi 'content-security-policy' && echo 'JS sin caché vieja y con CSP OK'
          # Cabeceras de seguridad del navegador (lo que revisa un pentest con testssl/ZAP): tienen que estar y ser estrictas.
          H=$(curl -fsSk -I https://localhost/)
          echo "$H" | grep -qi '^strict-transport-security:.*max-age=31536000'       && echo 'HSTS OK'
          echo "$H" | grep -qi '^x-content-type-options:[[:space:]]*nosniff'          && echo 'X-Content-Type-Options OK'
          echo "$H" | grep -qiE '^x-frame-options:[[:space:]]*DENY'                   && echo 'X-Frame-Options DENY OK'
          echo "$H" | grep -qi '^referrer-policy:[[:space:]]*no-referrer'             && echo 'Referrer-Policy OK'
          echo "$H" | grep -qi '^cross-origin-opener-policy:[[:space:]]*same-origin'  && echo 'COOP OK'
          echo "$H" | grep -qi '^permissions-policy:'                                 && echo 'Permissions-Policy OK'
          CSP=$(echo "$H" | grep -i '^content-security-policy:')
          echo "$CSP" | grep -qi "default-src 'self'"       && echo "CSP default-src 'self' OK"
          echo "$CSP" | grep -qi "frame-ancestors 'none'"   && echo "CSP frame-ancestors 'none' OK"
          echo "$CSP" | grep -qi "base-uri 'none'"          && echo "CSP base-uri 'none' OK"
          ! echo "$CSP" | grep -qi "unsafe-inline"          && echo 'CSP sin unsafe-inline OK'
          ! echo "$CSP" | grep -qi "unsafe-eval"            && echo 'CSP sin unsafe-eval OK'
          for i in $(seq 1 40); do curl -fsk https://localhost/auth/realms/staff/.well-known/openid-configuration >/dev/null && break; sleep 5; done
          curl -fsk https://localhost/auth/realms/staff/.well-known/openid-configuration | grep -q '"issuer":"https://localhost/auth/realms/staff"' && echo 'Keycloak en /auth OK'
          AUTH='https://localhost/auth/realms/staff/protocol/openid-connect/auth?client_id=home-banking-web&response_type=code&scope=openid'
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Flocalhost%2F")" = 200 && echo 'redirect URI de la app aceptada'
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Fotro.example%2F")" = 400 && echo 'redirect URI ajena rechazada'
          curl -fsk https://localhost/auth/realms/staff/protocol/openid-connect/token -d grant_type=client_credentials -d client_id=home-banking-admin --data-urlencode "client_secret=$(cat secrets/keycloak_admin_client_secret.txt)" | grep -q access_token && echo 'service account OK'
          sh scripts/verificar-bd.sh esquema
          sh scripts/configurar-correo.sh
          sh scripts/migrar-bases.sh && sh scripts/migrar-bases.sh   # idempotente sobre una base nueva
          sh scripts/verificar-bd.sh envios
          # Correo saliente del backend (envíos programados) por el buzón de prueba
          docker compose exec -T backend node -e "import('./src/correo.js').then((m) => m.enviarCorreo({ para: ['ci@valo.test'], asunto: 'CI envio programado', html: '<b>ok</b>', texto: 'ok' })).then(() => console.log('correo enviado'))"
          for i in $(seq 1 10); do curl -fs 'http://localhost:8025/api/v1/search?query=subject:%22CI%20envio%20programado%22' | grep -q '"total":1' && break; sleep 1; done
          curl -fs 'http://localhost:8025/api/v1/search?query=subject:%22CI%20envio%20programado%22' | grep -q '"total":1' && echo 'correo del backend recibido en Mailpit'
          # Feriados desde fuentes públicas (informativo: depende de servicios externos)
          docker compose logs jobs | grep -m1 -E 'feriados' || true
          sh scripts/verificar-bd.sh migraciones
          sh scripts/verificar-bd.sh permisos
          # Cambio de dirección pública (p. ej. ealyc.valo.ar) sobre un realm ya importado, y vuelta atrás
          HB_URL_PUBLICA=https://ealyc.valo.ar sh scripts/configurar-dominio.sh
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Fealyc.valo.ar%2F")" = 200 && echo 'dominio nuevo aceptado'
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Flocalhost%2F")" = 400 && echo 'dominio anterior rechazado'
          sh scripts/configurar-dominio.sh
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Flocalhost%2F")" = 200 && echo 'dominio restaurado'
          docker compose ps
      # DR: resguardo cifrado real de las dos bases del stack levantado y restauración de prueba en bases temporales
      # (nunca --restaurar). Evidencia de que resguardo.sh / restaurar-resguardo.sh / probar-dr.sh funcionan sobre SQL Server real.
      - name: Resguardo y simulacro de restauración (DR)
        run: |
          export HB_RESGUARDO_DIR="$RUNNER_TEMP/resguardos" HB_DR_STATUS_FILE="$RUNNER_TEMP/ultimo-simulacro-dr.env"
          mkdir -p "$HB_RESGUARDO_DIR"
          sh scripts/resguardo.sh
          sh scripts/probar-dr.sh
          cat "$HB_DR_STATUS_FILE"
          grep -qx 'estado=OK' "$HB_DR_STATUS_FILE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gestión de usuarios contra Keycloak real
        run: |
          cd backend && npm ci --omit=dev
          NODE_TLS_REJECT_UNAUTHORIZED=0 \
          OIDC_ISSUER=https://localhost/auth/realms/staff OIDC_INTERNAL_URL=https://localhost/auth/realms/staff \
          OIDC_ROLES_CLIENT=home-banking-api KEYCLOAK_ADMIN_CLIENT_ID=home-banking-admin \
          KEYCLOAK_ADMIN_CLIENT_SECRET_FILE=../secrets/keycloak_admin_client_secret.txt \
          DB_PASSWORD=x DBH_PASSWORD=x CREDENCIALES_MASTER_KEY=$(openssl rand -base64 32) MAILPIT_URL=http://localhost:8025 \
          node test/integracion-keycloak.mjs
      - name: Logs si falla
        if: failure()
        run: docker compose --profile sso-local --profile correo-prueba logs --no-color --tail 200
      - name: Bajar
        if: always()
        run: docker compose --profile sso-local --profile correo-prueba down -v

  publicar:
    name: Publicar en Docker Hub
    needs: [pruebas, seguridad, autorizacion, humo]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Verificar secretos
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Faltan los secretos DOCKERHUB_USERNAME y DOCKERHUB_TOKEN en el repositorio"; exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Nombre de la imagen
        id: img
        run: |
          echo "nombre=docker.io/${DOCKERHUB_USERNAME}/home-banking-valo" >> "$GITHUB_OUTPUT"
          echo "corto=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "rama=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9.\n-' '-')" >> "$GITHUB_OUTPUT"
        working-directory: .
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: home-banking/backend
          push: true
          tags: |
            ${{ steps.img.outputs.nombre }}:backend-${{ steps.img.outputs.rama }}
            ${{ steps.img.outputs.nombre }}:backend-${{ steps.img.outputs.corto }}
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: home-banking/frontend
          push: true
          tags: |
            ${{ steps.img.outputs.nombre }}:frontend-${{ steps.img.outputs.rama }}
            ${{ steps.img.outputs.nombre }}:frontend-${{ steps.img.outputs.corto }}
      - name: Base de datos (SQL Server 2025 con el esquema)
        uses: docker/build-push-action@v6
        with:
          context: home-banking/db
          push: true
          tags: |
            ${{ steps.img.outputs.nombre }}:db-${{ steps.img.outputs.rama }}
            ${{ steps.img.outputs.nombre }}:db-${{ steps.img.outputs.corto }}
      - name: Keycloak de prueba
        uses: docker/build-push-action@v6
        with:
          context: home-banking/keycloak
          push: true
          tags: |
            ${{ steps.img.outputs.nombre }}:keycloak-dev-${{ steps.img.outputs.rama }}
            ${{ steps.img.outputs.nombre }}:keycloak-dev-${{ steps.img.outputs.corto }}
      - name: Resumen
        run: |
          {
            echo "### Imágenes publicadas"
            echo "- \`${{ steps.img.outputs.nombre }}:backend-${{ steps.img.outputs.rama }}\` y \`backend-${{ steps.img.outputs.corto }}\`"
            echo "- \`${{ steps.img.outputs.nombre }}:frontend-${{ steps.img.outputs.rama }}\` y \`frontend-${{ steps.img.outputs.corto }}\`"
            echo "- \`db\` (SQL Server 2025 con el esquema) y \`keycloak-dev\` con los mismos tags"
            echo ""
            echo "En el servidor: \`HB_IMAGEN=${{ steps.img.outputs.nombre }}\` y \`HB_VERSION=${{ steps.img.outputs.rama }}\` en .env, después \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

  desde-docker-hub:
    name: Despliegue desde Docker Hub (kit sin código)
    needs: [publicar]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el kit (solo configuración, sin código)
        working-directory: .
        run: |
          mkdir -p kit/home-banking-valo/frontend/certs
          cp home-banking/docker-compose.yml home-banking/.env.example home-banking/DESPLIEGUE.md home-banking/PRUEBA-INTEGRADA.md kit/home-banking-valo/
          cp -r home-banking/scripts kit/home-banking-valo/
          touch kit/home-banking-valo/frontend/certs/.gitkeep
          ls -R kit
      - name: Secretos y configuración de prueba
        working-directory: kit/home-banking-valo
        run: |
          sh scripts/generar-secretos.sh
          corto=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > .env <<EOT
          HB_IMAGEN=docker.io/${DOCKERHUB_USERNAME}/home-banking-valo
          HB_VERSION=${corto}
          BDV_AMBIENTE=homo
          BDV_SOLO_CONSULTAS=true
          HB_URL_PUBLICA=https://localhost
          OIDC_ISSUER=https://localhost/auth/realms/staff
          OIDC_INTERNAL_URL=http://keycloak:8080/auth/realms/staff
          OIDC_ORIGIN=https://localhost
          OIDC_CLIENT_ID=home-banking-web
          OIDC_AUDIENCE=home-banking-api
          OIDC_ROLES_CLIENT=home-banking-api
          KEYCLOAK_ADMIN_CLIENT_ID=home-banking-admin
          HTTPS_PORT=443
          EOT
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Descargar imágenes y levantar (sin compilar)
        working-directory: kit/home-banking-valo
        run: |
          docker compose --profile sso-local pull
          docker compose --profile sso-local up -d --no-build --wait --wait-timeout 300
      - name: Verificar
        working-directory: kit/home-banking-valo
        run: |
          set -e
          curl -fsSk https://localhost/ | grep -q 'js/app.js'                      && echo 'frontend OK'
          curl -fsSk https://localhost/api/health                                   && echo ' backend OK'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/me)" = 401 && echo 'autenticación OK'
          for i in $(seq 1 40); do curl -fsk https://localhost/auth/realms/staff/.well-known/openid-configuration >/dev/null && break; sleep 5; done
          curl -fsk https://localhost/auth/realms/staff/.well-known/openid-configuration | grep -q '"issuer":"https://localhost/auth/realms/staff"' && echo 'Keycloak en /auth OK'
          AUTH='https://localhost/auth/realms/staff/protocol/openid-connect/auth?client_id=home-banking-web&response_type=code&scope=openid'
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Flocalhost%2F")" = 200 && echo 'redirect URI de la app aceptada'
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$AUTH&redirect_uri=https%3A%2F%2Fotro.example%2F")" = 400 && echo 'redirect URI ajena rechazada'
          curl -fsk https://localhost/auth/realms/staff/protocol/openid-connect/token -d grant_type=client_credentials -d client_id=home-banking-admin --data-urlencode "client_secret=$(cat secrets/keycloak_admin_client_secret.txt)" | grep -q access_token && echo 'service account OK'
          sh scripts/verificar-bd.sh esquema
          sh scripts/verificar-bd.sh roles
          docker compose ps
      - name: Logs si falla
        if: failure()
        working-directory: kit/home-banking-valo
        run: docker compose --profile sso-local logs --no-color --tail 200
      - name: Bajar
        if: always()
        working-directory: kit/home-banking-valo
        run: docker compose --profile sso-local down -v
      - name: Publicar el kit (sin secretos)
        if: success()
        working-directory: .
        run: rm -rf kit/home-banking-valo/secrets kit/home-banking-valo/.env kit/home-banking-valo/frontend/certs/tls.*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kit-despliegue-home-banking
          path: kit/
          retention-days: 90

  maquina-prueba:
    name: Máquina de prueba (script del Codespace + Portainer)
    needs: [publicar]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Levantar con el mismo script que usa el Codespace
        working-directory: .
        run: |
          jq . .devcontainer/devcontainer.json >/dev/null
          HB_VERSION=$(echo "$GITHUB_SHA" | cut -c1-7) bash home-banking/scripts/maquina-prueba.sh
      - name: Verificar
        run: |
          set -e
          curl -fsSk https://localhost/ | grep -q 'js/app.js'      && echo 'Home Banking OK'
          curl -fsSk https://localhost/api/health                   && echo ' backend OK'
          for i in $(seq 1 40); do curl -fsk https://localhost/auth/realms/staff/.well-known/openid-configuration >/dev/null && break; sleep 5; done
          curl -fsk https://localhost/auth/realms/staff/.well-known/openid-configuration | grep -q '"issuer":"https://localhost/auth/realms/staff"' && echo 'Keycloak OK'
          for i in $(seq 1 30); do curl -fsk https://localhost:9443/api/system/status >/dev/null && break; sleep 2; done
          jq -n --rawfile p secrets/portainer_admin_password.txt '{username:"admin",password:$p}' \
            | curl -fsk https://localhost:9443/api/auth -H 'Content-Type: application/json' -d @- | grep -q '"jwt"' && echo 'Portainer: ingreso de admin OK'
          # Segunda corrida (actualizar): tiene que ser idempotente
          cd .. && HB_VERSION=$(echo "$GITHUB_SHA" | cut -c1-7) bash home-banking/scripts/maquina-prueba.sh
      - name: Logs si falla
        if: failure()
        run: docker compose --profile sso-local --profile correo-prueba logs --no-color --tail 200; docker logs portainer || true
      - name: Bajar
        if: always()
        run: docker compose --profile sso-local --profile correo-prueba down -v; docker rm -f portainer || true
