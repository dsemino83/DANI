# Configuración de gitleaks para el CI. Usa las reglas por defecto y quita falsos positivos conocidos.
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos"
# Clave publishable/anon de Supabase (subproyecto valo/): es PÚBLICA por diseño — va al navegador y se
# protege con Row Level Security, no con secreto. No la confundir con la service_role, que sí es secreta.
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+''',
]
