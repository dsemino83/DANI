# OpenTelemetry Collector del Home Banking. Recibe trazas del backend por OTLP (gRPC 4317 / HTTP 4318) en la
# red interna. Por defecto solo las imprime (exporter debug): es autosuficiente y no requiere infraestructura
# externa. En un entorno real, acá se agrega el exporter hacia Tempo / Jaeger / el backend de trazas elegido.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  batch: {}

exporters:
  # Default autosuficiente: imprime un resumen de las trazas recibidas. Reemplazar por otlp/tempo/jaeger en prod.
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
