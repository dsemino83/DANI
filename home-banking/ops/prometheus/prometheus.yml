global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # El backend del Home Banking escucha en 8080 y expone las métricas en /api/metrics.
  # Prometheus lo consulta directo por la red interna (app), NO a través de Nginx.
  - job_name: home-banking-backend
    metrics_path: /api/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - backend:8080
    authorization:
      type: Bearer
      # Mismo token que el backend valida (METRICS_TOKEN). El archivo se monta desde secrets/metrics_token.
      credentials_file: /etc/prometheus/secrets/metrics_token
