# Home Banking VALO
#   docker compose up -d                      -> homologación/producción (login contra el SSO de VALO)
#   docker compose --profile dev up -d        -> además levanta un Keycloak local para desarrollo
# Los secretos se leen de ./secrets/*.txt (ver README); nunca se suben al repositorio.

name: home-banking-valo

x-backend-env: &backend-env
  NODE_ENV: production
  BDV_AMBIENTE: ${BDV_AMBIENTE:-homo}
  BDV_URL_HOMO: ${BDV_URL_HOMO:-}   # solo homologación (simulador); producción es fija
  BDV_SOLO_CONSULTAS: ${BDV_SOLO_CONSULTAS:-false}   # true: ninguna transferencia llega al banco
  OIDC_ISSUER: ${OIDC_ISSUER}
  OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-${OIDC_ISSUER}}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-home-banking-api}
  OIDC_ROLES_CLIENT: ${OIDC_ROLES_CLIENT:-home-banking-api}
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-home-banking-admin}
  KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_admin_client_secret
  DB_HOST: postgres
  DB_NAME: homebanking
  DB_USER: hb_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  DBH_HOST: postgres-historico
  DBH_NAME: homebanking_hist
  DBH_USER: hb_hist_ro
  DBH_PASSWORD_FILE: /run/secrets/db_hist_ro_password
  CREDENCIALES_MASTER_KEY_FILE: /run/secrets/credenciales_master_key
  BDV_SESION_MINUTOS: ${BDV_SESION_MINUTOS:-20}
  # Correo saliente (envíos programados): vacío = buzón de prueba Mailpit; clave en secrets/smtp_password.txt
  HB_SMTP_HOST: ${HB_SMTP_HOST:-mailpit}
  HB_SMTP_PORT: ${HB_SMTP_PORT:-}
  HB_SMTP_FROM: ${HB_SMTP_FROM:-homebanking@valo.test}
  HB_SMTP_USUARIO: ${HB_SMTP_USUARIO:-}
  HB_SMTP_STARTTLS: ${HB_SMTP_STARTTLS:-true}
  HB_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  TZ: America/Argentina/Buenos_Aires

services:
  frontend:
    build: ./frontend
    # Con HB_IMAGEN en .env se descarga la imagen publicada (docker compose pull) en lugar de compilarla
    image: ${HB_IMAGEN:-home-banking-valo}:frontend-${HB_VERSION:-local}
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-home-banking-web}
      OIDC_ORIGIN: ${OIDC_ORIGIN:-https://ssohomo.valo.ar}   # para la CSP (connect-src / form-action)
      DOC_AUDITORIA_URL: ${DOC_AUDITORIA_URL:-}
      DOC_TECNICA_URL: ${DOC_TECNICA_URL:-}
      DOC_MANUAL_URL: ${DOC_MANUAL_URL:-}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [publica, interna]

  backend:
    build: ./backend
    image: ${HB_IMAGEN:-home-banking-valo}:backend-${HB_VERSION:-local}
    environment: *backend-env
    secrets: [db_app_password, db_hist_ro_password, credenciales_master_key, keycloak_admin_client_secret, smtp_password]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-historico:
        condition: service_healthy
    restart: unless-stopped
    networks: [interna, salida]   # "salida": acceso a internet para el SSO y el Banco de Valores

  jobs:
    build: ./backend
    image: ${HB_IMAGEN:-home-banking-valo}:backend-${HB_VERSION:-local}   # misma imagen que el backend
    command: ["node", "src/jobs/programador.js"]
    environment:
      <<: *backend-env
      DB_OWNER_USER: postgres
      DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      DBH_OWNER_USER: postgres
      DBH_OWNER_PASSWORD_FILE: /run/secrets/dbh_owner_password
    secrets: [db_app_password, db_hist_ro_password, credenciales_master_key, keycloak_admin_client_secret, db_owner_password, dbh_owner_password, smtp_password]
    healthcheck:   # el programador actualiza /tmp/latido cada minuto
      test: ["CMD-SHELL", "find /tmp/latido -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-historico:
        condition: service_healthy
    restart: unless-stopped
    networks: [interna, salida]

  postgres:
    build: ./db/operativa          # postgres:16.4-alpine + esquema y roles
    image: ${HB_IMAGEN:-home-banking-valo}:db-operativa-${HB_VERSION:-local}
    environment:
      POSTGRES_DB: homebanking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      TZ: UTC
    secrets: [db_owner_password, db_app_password]
    volumes:
      - pg_operativa:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homebanking"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [interna]

  postgres-historico:
    build: ./db/historica          # postgres:16.4-alpine + esquema y rol de solo lectura
    image: ${HB_IMAGEN:-home-banking-valo}:db-historica-${HB_VERSION:-local}
    environment:
      POSTGRES_DB: homebanking_hist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/dbh_owner_password
      TZ: UTC
    secrets: [dbh_owner_password, db_hist_ro_password]
    volumes:
      - pg_historica:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homebanking_hist"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [interna]

  # Keycloak propio (perfil "sso-local"): usuarios, perfiles y roles manejados desde Docker, para pruebas o
  # mientras no esté el SSO de VALO. Se publica por el frontend en https://<servidor>/auth (sin puerto propio).
  # Consola del administrador de seguridad: https://<servidor>/auth/admin/staff/console/
  keycloak:
    build: ./keycloak              # Keycloak 26.0.5 + realm "staff"
    image: ${HB_IMAGEN:-home-banking-valo}:keycloak-dev-${HB_VERSION:-local}
    profiles: [dev, sso-local]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin                         # consola maestra; clave en secrets/
      KC_HOSTNAME: ${HB_URL_PUBLICA:-https://localhost}/auth      # URL pública: issuer de los tokens
      HB_URL_PUBLICA: ${HB_URL_PUBLICA:-https://localhost}        # redirect URI del cliente web
    secrets: [keycloak_bootstrap_password, keycloak_admin_client_secret]
    volumes:
      - keycloak_datos:/opt/keycloak/data                         # usuarios y cambios persisten
    restart: unless-stopped
    networks: [interna, salida]   # "salida": correo saliente (SMTP) para los avisos de cambio de clave

  # Buzón de correo de prueba (perfil "correo-prueba"): recibe los correos que manda Keycloak (cambio de clave)
  # y los muestra en http://localhost:8025. Solo para pruebas: escucha únicamente en la máquina local.
  # Con un servidor de correo real, configurarlo con scripts/configurar-correo.sh (ver DESPLIEGUE.md).
  mailpit:
    image: axllent/mailpit:v1.20.5
    profiles: [correo-prueba]
    ports:
      - "127.0.0.1:${HB_CORREO_PRUEBA_PUERTO:-8025}:8025"
    restart: unless-stopped
    networks: [interna, publica]

secrets:
  db_owner_password:
    file: ./secrets/db_owner_password.txt
  dbh_owner_password:
    file: ./secrets/dbh_owner_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  db_hist_ro_password:
    file: ./secrets/db_hist_ro_password.txt
  credenciales_master_key:
    file: ./secrets/credenciales_master_key.txt
  keycloak_admin_client_secret:
    file: ./secrets/keycloak_admin_client_secret.txt
  keycloak_bootstrap_password:
    file: ./secrets/keycloak_bootstrap_password.txt
  smtp_password:   # vacío si el servidor de correo no pide clave (o con el buzón de prueba)
    file: ./secrets/smtp_password.txt

volumes:
  pg_operativa:
  pg_historica:
  keycloak_datos:

networks:
  publica:
  interna:
    internal: true   # las bases no tienen salida a internet
  salida:
