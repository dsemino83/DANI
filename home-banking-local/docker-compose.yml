# Home Banking VALO · instalación local (sin SSO: los usuarios viven en la base y se administran desde la aplicación)
#   Iniciar:  ./iniciar.sh            (o iniciar.ps1 en Windows)  -> banco real (sale solo hacia el Banco de Valores)
#             ./iniciar.sh simulador                              -> sin internet, con el simulador del banco
#   Detener:  ./detener.sh
# Por defecto la aplicación solo se abre desde esta misma máquina (https://localhost). Para que entren otras PCs de la
# red interna: HB_ESCUCHA=0.0.0.0 en .env (y NO abrir ese puerto hacia internet en el firewall/router).
# Los secretos se leen de ./secrets/*.txt (los crea scripts/generar-secretos.sh); nunca se suben al repositorio.

name: home-banking-valo

x-backend-env: &backend-env
  NODE_ENV: production
  BDV_AMBIENTE: ${BDV_AMBIENTE:-homo}
  BDV_URL_HOMO: ${BDV_URL_HOMO:-}   # solo homologación (simulador); producción es fija
  BDV_SOLO_CONSULTAS: ${BDV_SOLO_CONSULTAS:-false}   # true: ninguna transferencia llega al banco
  # Usuarios propios (sin SSO): duración de la sesión, bloqueo por intentos y primer administrador
  HB_URL_PUBLICA: ${HB_URL_PUBLICA:-https://localhost}   # dirección con la que entran los usuarios (links de los correos)
  HB_SESION_MINUTOS: ${HB_SESION_MINUTOS:-15}
  HB_SESION_HORAS_MAX: ${HB_SESION_HORAS_MAX:-10}
  HB_INTENTOS_MAX: ${HB_INTENTOS_MAX:-5}
  HB_BLOQUEO_MINUTOS: ${HB_BLOQUEO_MINUTOS:-15}
  HB_ADMIN_USUARIO: ${HB_ADMIN_USUARIO:-admin}
  HB_ADMIN_CLAVE_FILE: /run/secrets/admin_inicial_password
  DB_HOST: sqlserver          # SQL Server 2025: una instancia con dos bases (homebanking y homebanking_hist)
  DB_TRUST_SERVER_CERT: ${DB_TRUST_SERVER_CERT:-true}   # certificado propio de la instancia; el tráfico va cifrado por la red interna "datos"
  DB_NAME: homebanking
  DB_USER: hb_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  DBH_HOST: sqlserver
  DBH_NAME: homebanking_hist
  DBH_USER: hb_hist_ro
  DBH_PASSWORD_FILE: /run/secrets/db_hist_ro_password
  CREDENCIALES_MASTER_KEY_FILE: /run/secrets/credenciales_master_key
  BDV_SESION_MINUTOS: ${BDV_SESION_MINUTOS:-20}
  BDV_CONCURRENCIA: ${BDV_CONCURRENCIA:-3}   # cuentas distintas consultadas a la vez (solo lectura); la paginación de una cuenta es secuencial
  BDV_CIRCUIT_BREAKER_ENABLED: ${BDV_CIRCUIT_BREAKER_ENABLED:-true}
  BDV_CIRCUIT_BREAKER_FAILURES: ${BDV_CIRCUIT_BREAKER_FAILURES:-5}
  BDV_CIRCUIT_BREAKER_RESET_MS: ${BDV_CIRCUIT_BREAKER_RESET_MS:-30000}
  # Correo saliente (envíos programados): vacío = buzón de prueba Mailpit; clave en secrets/smtp_password.txt
  # Meses completos que conserva la base operativa además del mes en curso; lo anterior pasa a la histórica el día 1
  HB_RETENCION_MESES: ${HB_RETENCION_MESES:-1}
  HB_SMTP_HOST: ${HB_SMTP_HOST:-mailpit}
  HB_SMTP_PORT: ${HB_SMTP_PORT:-}
  HB_SMTP_FROM: ${HB_SMTP_FROM:-alyc@valo.ar}
  HB_SMTP_USUARIO: ${HB_SMTP_USUARIO:-}
  HB_SMTP_STARTTLS: ${HB_SMTP_STARTTLS:-true}
  HB_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  # Salida de correo de respaldo (opcional): si el principal falla, el correo se reintenta por acá.
  HB_SMTP2_HOST: ${HB_SMTP2_HOST:-}
  HB_SMTP2_PORT: ${HB_SMTP2_PORT:-}
  HB_SMTP2_FROM: ${HB_SMTP2_FROM:-}
  HB_SMTP2_USUARIO: ${HB_SMTP2_USUARIO:-}
  HB_SMTP2_PASSWORD_FILE: /run/secrets/smtp2_password   # clave del SMTP de respaldo: Docker secret (vacío si no se usa)
  HB_SMTP2_STARTTLS: ${HB_SMTP2_STARTTLS:-true}
  HB_POWERAUTOMATE_URL: ${HB_POWERAUTOMATE_URL:-}   # alertas por chat de Teams; vacío = solo correo (ver powerautomate/)
  HB_CHAT_DOMINIO: ${HB_CHAT_DOMINIO:-@valo.ar}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}        # observabilidad: expone /api/metrics para Prometheus (ver ops/)
  METRICS_TOKEN: ${METRICS_TOKEN:-}                 # protege el scrape; vacío = sin token (solo red interna)
  SYNTHETIC_MONITOR_ENABLED: ${SYNTHETIC_MONITOR_ENABLED:-false}   # monitoreo sintético de disponibilidad del banco (solo lectura; lo corre jobs)
  SYNTHETIC_MONITOR_CRON: ${SYNTHETIC_MONITOR_CRON:-*/5 * * * *}
  SYNTHETIC_TIMEOUT_MS: ${SYNTHETIC_TIMEOUT_MS:-10000}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}              # OpenTelemetry (trazas); apagado por defecto (ver ops/docker-compose.otel.yml)
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-home-banking-backend}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.10}
  OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-15000}
  TZ: America/Argentina/Buenos_Aires

# Endurecimiento común: sin escalada de privilegios y logs rotados (no llenan el disco)
x-endurecido: &endurecido
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  frontend:
    build: ./frontend
    # Con HB_IMAGEN en .env se descarga la imagen publicada (docker compose pull) en lugar de compilarla
    image: ${HB_IMAGEN:-home-banking-valo}:frontend-${HB_VERSION:-local}
    ports:
      # 127.0.0.1 = solo esta máquina. HB_ESCUCHA=0.0.0.0 (o la IP interna del servidor) = toda la red interna.
      - "${HB_ESCUCHA:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    environment:
      HB_NOMBRE_SERVIDOR: ${HB_NOMBRE_SERVIDOR:-}   # nombre o IP del servidor en la red interna (certificado autofirmado)
    volumes:
      - ./frontend/certs:/etc/nginx/certs   # si está vacía, el contenedor crea un certificado autofirmado
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    <<: *endurecido
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE]   # Nginx: arranca como root (crea el certificado si falta), escucha 443 y baja a nginx
    mem_limit: 256m
    pids_limit: 256
    networks: [publica, app]   # no ve las bases de datos

  backend:
    build: ./backend
    image: ${HB_IMAGEN:-home-banking-valo}:backend-${HB_VERSION:-local}
    environment: *backend-env
    secrets: [db_app_password, db_hist_ro_password, credenciales_master_key, admin_inicial_password, smtp_password, smtp2_password]
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    <<: *endurecido
    read_only: true            # sistema de archivos inmutable; solo /tmp en memoria
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 512
    networks: [app, datos, salida]   # "salida": solo hacia el Banco de Valores (y el SMTP real, si se configura)

  jobs:
    build: ./backend
    image: ${HB_IMAGEN:-home-banking-valo}:backend-${HB_VERSION:-local}   # misma imagen que el backend
    command: ["node", "src/jobs/programador.js"]
    environment:
      <<: *backend-env
      # El programador NO usa el rol del backend (hb_app): rol propio con mínimo privilegio (db/esquema/operativa/permisos.sql)
      DB_USER: hb_jobs
      DB_PASSWORD_FILE: /run/secrets/db_jobs_app_password
      # Pase mensual a la histórica: logins dedicados (solo leen y borran lo que pasan), NO sa
      DB_PASE_USER: hb_pase
      DB_PASE_PASSWORD_FILE: /run/secrets/db_jobs_password
      DBH_PASE_USER: hb_pase_h
      DBH_PASE_PASSWORD_FILE: /run/secrets/dbh_jobs_password
      HB_ADMIN_CLAVE_FILE: ""   # el programador no crea usuarios: no recibe la clave del administrador inicial
    secrets: [db_jobs_app_password, db_hist_ro_password, credenciales_master_key, db_jobs_password, dbh_jobs_password, smtp_password, smtp2_password]
    healthcheck:   # el programador actualiza /tmp/latido cada minuto
      test: ["CMD-SHELL", "find /tmp/latido -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    <<: *endurecido
    read_only: true
    tmpfs: [/tmp]              # latido del healthcheck
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 512
    networks: [app, datos, salida]   # app: correo (Mailpit) · datos: bases · salida: banco y SMTP real

  # Provisión idempotente en cada arranque (ver db/aplicar.sh): crea las bases si faltan, aplica las migraciones pendientes
  # (db/esquema) y sincroniza logins y permisos con los secretos, también en volúmenes ya existentes. backend y jobs esperan.
  db-init:
    build: ./db
    image: ${HB_IMAGEN:-home-banking-valo}:db-${HB_VERSION:-local}   # misma imagen que sqlserver
    entrypoint: ["/opt/hb/aplicar.sh"]
    secrets: [db_owner_password, db_app_password, db_jobs_app_password, db_jobs_password, db_hist_ro_password, dbh_jobs_password]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    <<: *endurecido
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    networks: [datos]

  # SQL Server 2025 (Developer en pruebas; en producción corre con la licencia de VALO: MSSQL_PID). Una instancia,
  # dos bases: homebanking (operativa) y homebanking_hist (histórica). sa solo lo usa db-init; la aplicación entra con
  # logins de mínimo privilegio. La clave de sa sale del Docker secret db_owner_password (db/arranque.sh).
  sqlserver:
    build: ./db
    image: ${HB_IMAGEN:-home-banking-valo}:db-${HB_VERSION:-local}
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}           # términos de uso de Microsoft SQL Server (obligatorio para arrancar)
      MSSQL_PID: ${MSSQL_PID:-Developer}       # edición: Developer (pruebas), Standard, Enterprise o la clave de producto de VALO
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-3072}
      MSSQL_AGENT_ENABLED: "false"
      MSSQL_TELEMETRY_ENABLED: "false"         # sin telemetría hacia Microsoft
      TZ: UTC
    secrets: [db_owner_password]
    volumes:
      - mssql_datos:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=$$(cat /run/secrets/db_owner_password) /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -h -1 -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    <<: *endurecido
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # sqlservr trae esa capacidad en el binario: sin ella en el conjunto permitido no arranca
    mem_limit: 4g
    pids_limit: 1024
    networks: [datos]   # solo la ven el backend, jobs y db-init

  # Buzón de correo local: recibe los correos de la aplicación (links para elegir clave, envíos programados) y los
  # muestra en http://localhost:8025. Escucha únicamente en esta máquina. Con un servidor de correo real de VALO,
  # completar HB_SMTP_* en .env (ver LEEME-LOCAL.md).
  mailpit:
    image: axllent/mailpit:v1.20.5
    ports:
      - "127.0.0.1:${HB_CORREO_PRUEBA_PUERTO:-8025}:8025"
    restart: unless-stopped
    <<: *endurecido
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [app, publica]

secrets:
  db_owner_password:
    file: ./secrets/db_owner_password.txt
  db_jobs_password:
    file: ./secrets/db_jobs_password.txt
  db_jobs_app_password:
    file: ./secrets/db_jobs_app_password.txt
  dbh_jobs_password:
    file: ./secrets/dbh_jobs_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  db_hist_ro_password:
    file: ./secrets/db_hist_ro_password.txt
  credenciales_master_key:
    file: ./secrets/credenciales_master_key.txt
  admin_inicial_password:   # clave temporal del primer administrador (se cambia en el primer ingreso)
    file: ./secrets/admin_inicial_password.txt
  smtp_password:   # vacío si el servidor de correo no pide clave (o con el buzón de prueba)
    file: ./secrets/smtp_password.txt
  smtp2_password:  # clave del SMTP de respaldo (HB_SMTP2_*); vacío si no se usa
    file: ./secrets/smtp2_password.txt

volumes:
  mssql_datos:

# Microsegmentación: cada servicio ve solo las redes que necesita
networks:
  publica:           # frontend (443) y el buzón de prueba
  app:
    internal: true   # frontend ↔ backend/jobs ↔ Mailpit (y el simulador), sin salida a internet
  datos:
    internal: true   # backend/jobs ↔ base; el frontend no llega a las bases
  salida:            # backend y jobs hacia el banco y el SMTP (en modo simulador queda sin salida: ver docker-compose.sin-internet.yml)
