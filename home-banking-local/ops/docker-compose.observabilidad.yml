# Observabilidad (opcional): Prometheus + Grafana. Es un OVERLAY del compose principal, no se usa solo.
#
#   docker compose -f docker-compose.yml -f ops/docker-compose.observabilidad.yml up -d
#
# Requiere, en el backend, METRICS_ENABLED=true y el mismo token en METRICS_TOKEN (.env) y en
# secrets/metrics_token. Ver ops/README-OBSERVABILIDAD.md. Prometheus consulta backend:8080/api/metrics por
# la red interna "app" (definida en el compose principal); Nginx no expone /api/metrics al público.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: "65534:65534"              # nobody; el volumen de datos le pertenece
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_token.txt:/etc/prometheus/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    networks: [app]                   # misma red que el backend, para resolver "backend:8080"
    expose:
      - "9090"                        # solo interno; no se publica al host
    cap_drop: [ALL]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    networks: [app]
    ports:
      # Panel de Grafana. En la máquina de prueba (Codespace) se reenvía este puerto. En producción iría detrás
      # del reverse proxy / en red interna, no publicado.
      - "127.0.0.1:${HB_GRAFANA_PUERTO:-3001}:3000"
    mem_limit: 512m

volumes:
  prometheus_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
