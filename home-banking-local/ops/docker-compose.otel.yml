# OpenTelemetry Collector (opcional). Es un OVERLAY del compose principal, no se usa solo.
#
#   docker compose -f docker-compose.yml -f ops/docker-compose.otel.yml up -d
#
# Levanta el collector en la red interna "app" (definida en el compose principal) y enciende OTEL en el
# backend. El collector NO se expone al público (solo "expose", sin "ports"). Si el collector está caído, el
# Home Banking sigue funcionando (las trazas son best-effort).
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [app]
    expose:
      - "4317"   # OTLP gRPC — solo interno
      - "4318"   # OTLP HTTP — solo interno
    cap_drop: [ALL]
    mem_limit: 384m

  # Al usar este overlay se enciende OTEL en el backend (se fusiona con las variables del anchor).
  backend:
    environment:
      OTEL_ENABLED: "true"
