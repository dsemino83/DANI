groups:
  - name: home-banking
    rules:
      - alert: HomeBankingBackendDown
        expr: up{job="home-banking-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend Home Banking no disponible"
          description: "Prometheus no puede obtener métricas del backend durante más de 2 minutos."

      - alert: HomeBankingHigh5xx
        expr: |
          sum(rate(homebanking_http_errors_5xx_total[5m]))
          /
          clamp_min(sum(rate(homebanking_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tasa elevada de errores 5xx"
          description: "Más del 5% de las respuestas HTTP están resultando en 5xx."

      - alert: HomeBankingHighLatency
        expr: |
          (
            sum(rate(homebanking_http_request_duration_ms_sum[5m]))
            /
            clamp_min(sum(rate(homebanking_http_request_duration_ms_count[5m])), 1)
          ) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia HTTP elevada"
          description: "La latencia HTTP media agregada supera 1 segundo."
