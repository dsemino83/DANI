# Modo SIN INTERNET: se suma a docker-compose.yml (lo usa "./iniciar.sh simulador").
#  - Ningún contenedor tiene salida a internet: la red "salida" pasa a ser interna.
#  - El Banco de Valores se reemplaza por el simulador (cuentas y movimientos ficticios, nada real).
#  - Feriados: sin las fuentes públicas se cargan los de fecha fija; los móviles se agregan a mano desde la aplicación.
# Para volver al banco real: ./iniciar.sh (sin "simulador").
name: home-banking-valo

services:
  simulador:
    build: ./simulador
    image: ${HB_IMAGEN:-home-banking-valo}:simulador-${HB_VERSION:-local}
    environment:
      SIM_CLAVE: ${SIM_CLAVE:-clave-simulador}
    volumes:
      - simulador_datos:/datos          # llave RSA del simulador (así la credencial cargada sigue sirviendo)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    networks: [app]

  backend:
    environment:
      BDV_AMBIENTE: homo
      BDV_URL_HOMO: http://simulador:8080/bdv
      HB_SIMULADOR_LLAVE_URL: http://simulador:8080/llave-publica   # carga sola la credencial API la primera vez
      SIM_CLAVE: ${SIM_CLAVE:-clave-simulador}
    depends_on:
      simulador:
        condition: service_healthy

  jobs:
    environment:
      BDV_AMBIENTE: homo
      BDV_URL_HOMO: http://simulador:8080/bdv

volumes:
  simulador_datos:

networks:
  salida:
    internal: true   # sin salida a internet
